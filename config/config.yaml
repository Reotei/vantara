seed: 42

paths:
  raw: data/raw/online_retail_II.xlsx
  raw_url: https://raw.githubusercontent.com/PykaAlexandro/An-Online-Retailer-Investigation/main/online_retail_II.xlsx
  interim: data/interim/transactions.parquet
  processed: data/processed
  artifacts: models_artifacts
  figures: docs/figures

data:
  product_code_pattern: '^\d{5}[A-Z]{0,2}$'   # everything else is postage, fees, manual adjustments
  min_date: '2009-12-01'
  max_date: '2011-12-10'
  max_missing_customer_rate: 0.30
  extreme_quantity: 5000                       # >= this and fully reversed by a cancellation => entry error
  iqr_multiplier: 3.0

labels:
  churn_horizon_days: 90
  clv_horizon_days: 365
  active_window_days: 730                      # customers scored = every customer seen in the last two years

features:
  top_countries: [United Kingdom, Germany, France, EIRE, Netherlands]
  markdown_ratio: 0.95
  trend_months: 12
  categories:                                  # first keyword match wins
    Christmas: [CHRISTMAS, XMAS, ADVENT, SANTA, REINDEER, SNOWFLAKE]
    Bags: [BAG, TOTE, SHOPPER]
    Lighting: [CANDLE, LIGHT, LANTERN, T-LIGHT, TEALIGHT, LAMP]
    Kitchen: [MUG, CUP, PLATE, BOWL, TEAPOT, CAKE, BAKING, JAR, LUNCH, SPOON, TIN, BOTTLE, TRAY, NAPKIN, COASTER]
    Stationery: [CARD, WRAP, PAPER, NOTEBOOK, PEN, PENCIL, STICKER, ENVELOPE, CHALK, TAPE, BOOK]
    Party: [PARTY, BUNTING, BALLOON, CONFETTI, GARLAND]
    Toys: [TOY, GAME, JIGSAW, DOLL, SPACEBOY, SKITTLES, PLAYHOUSE]
    Garden: [GARDEN, PLANT, FLOWER, POT, WATERING, BIRD]
    Accessories: [NECKLACE, BRACELET, EARRING, RING, PURSE, UMBRELLA, HAIR, CHARM, BROOCH]
    Home Decor: [SIGN, FRAME, CLOCK, MIRROR, CUSHION, DOORMAT, HOOK, DECORATION, HEART, HANGING, BOX, DRAWER, WICKER]

models:
  cv_folds: 5
  n_iter: 12
  min_recall: 0.70
  split: [0.70, 0.15, 0.15]
  grids:
    logistic_regression: {C: [0.01, 0.1, 1, 10], l1_ratio: [0.0, 0.5, 1.0]}
    decision_tree: {max_depth: [3, 4, 5, 6, 8], min_samples_leaf: [10, 25, 50]}
    random_forest: {n_estimators: [200, 400], max_depth: [6, 10, null], min_samples_leaf: [2, 5, 10]}
    xgboost: {learning_rate: [0.02, 0.05, 0.1], max_depth: [3, 4, 5], subsample: [0.7, 0.85, 1.0], colsample_bytree: [0.6, 0.8, 1.0]}
    lightgbm: {learning_rate: [0.02, 0.05, 0.1], num_leaves: [7, 15, 31], min_child_samples: [10, 20, 40], subsample: [0.7, 1.0], colsample_bytree: [0.6, 0.8, 1.0]}
    knn: {n_neighbors: [15, 31, 51, 101], weights: [uniform, distance], p: [1, 2]}
  deep:
    max_epochs: 200
    patience: 15
    batch_size: 128
    lr: 0.001
    seq_len: 20
    anomaly_quantile: 0.99

segmentation:
  k_range: [4, 7]
  silhouette_tolerance: 0.025                  # take the most granular k within this of the best silhouette...
  min_cluster_share: 0.03                      # ...whose smallest segment holds at least 3% of customers
  features: [recency_days, frequency, monetary_total, avg_order_value, q4_share, tenure_days]
  actions:
    Champions: Reward with early access and loyalty perks; no discounts needed.
    Loyal Regulars: Cross-sell adjacent categories and invite to the loyalty tier.
    Big-Ticket Wholesalers: Assign an account manager and offer volume pricing.
    Seasonal Gift Shoppers: Time campaigns for Sep–Nov with gift bundles.
    Lapsed High-Value: Personal win-back outreach with a targeted incentive.
    Fading Occasionals: Low-cost re-engagement email with bestsellers.
    New & Promising: Onboarding series and a second-order incentive.

risk_bands: {medium: 0.4, high: 0.7}
value_tiers: {high: 0.8, mid: 0.5}            # CLV percentile cut-offs
lime_samples: 1500
